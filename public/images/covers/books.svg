    <rect x="35" y="10" width="760" height="90" rx="8" fill="#f2c14e"/>
    <g fill="#fffaf0" font-family="sans-serif" font-size="30" font-weight="700">
      <text x="125" y="68">ENGINEERING</text>
      <text x="125" y="148">RELIABILITY</text>
